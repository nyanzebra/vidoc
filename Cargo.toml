[package]
name = "vidoc"
version = "0.1.0"
edition = "2021"
description = "A video and image codec library"
repository = "https://github.com/nyanzebra/vidoc"
license = "MIT"
keywords = ["codec", "compression", "encoding", "image", "video"]
categories = ["multimedia::video"]

[[example]]
name = "camera"
path = "examples/camera.rs"

[[example]]
name = "video_player"
path = "examples/video_player.rs"

[dependencies]
bitstream-io = "4.10.0"
crossbeam-channel = "0.5"
num-traits = "0.2"
rayon = "1.12.0"
thiserror = "2.0.20"
wide = "1"  # Portable SIMD operations

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.7", features = ["html_reports"] }
image = "0.25.10"
minifb = "0.28.0"
nokhwa = { version = "0.10", features = ["input-native"] }
ntest = "0.9"
test-case = "3"
tiff = "0.10.3"
y4m = "0.8"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

[profile.test]
inherits = "release"

[profile.samply]
inherits = "release"
debug = true
