[package]
name = "vidoc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A video and image codec library"
repository = "https://github.com/nyanzebra/vidoc"
keywords = ["video", "image", "codec", "compression", "encoding"]
categories = ["multimedia::video"]

[dependencies]
num-traits = "0.2"
thiserror = "2.0.20"
rayon = "1.12.0"
crossbeam-channel = "0.5"
wide = "1"  # Portable SIMD operations

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.7", features = ["html_reports"] }
image = "0.25.10"
minifb = "0.28.0"
nokhwa = { version = "0.10", features = ["input-native"] }
ntest = "0.9"
test-case = "3"
tiff = "0.10.3"
y4m = "0.8"

[profile.release]
debug = true

[profile.test]
inherits = "release"

[[example]]
name = "camera"
path = "examples/camera.rs"

[[example]]
name = "video_player"
path = "examples/video_player.rs"

[profile.samply]
inherits = "release"
debug = true
